name: Check

on:
  push:
  pull_request:

jobs:
  check:
    name: Tests and banned copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Banned copy in source and rendered pages
        run: bash scripts/check-banned.sh

name: Check

on:
  push:
  pull_request:

jobs:
  check:
    name: Tests and banned copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Banned copy and page assets
        run: bash scripts/check-banned.sh

  container:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t crom-api-webhook-sample:ci .
      - name: Boot non-root and require live run data
        run: bash scripts/check-container.sh crom-api-webhook-sample:ci

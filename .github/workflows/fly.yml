name: Deploy to Fly

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "fly.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fly.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only
      - name: Skip when FLY_API_TOKEN is unset
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "FLY_API_TOKEN secret is not set; skipping Fly deploy."

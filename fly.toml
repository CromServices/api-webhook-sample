# Disposable public demo for Crom Services api-webhook-sample.
# Sample crumb only — not a forever-host for client workloads.
#
# One machine, no volume. fly.toml cannot set the machine count.
# `fly deploy` keeps the count last set by scale. A deploy that has to create
# machines from zero passes --ha=false in .github/workflows/fly.yml so it does
# not add a spare. To put the running app on a single machine, run:
#   flyctl scale count 1 -a crom-api-webhook-demo
app = "crom-api-webhook-demo"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # Published demo secret (same as the process default). Rotate-able public
  # sample value — never a client secret. Override with
  # `fly secrets set WEBHOOK_SECRET=...` if the documented value changes.
  WEBHOOK_SECRET = "crom-demo-webhook-secret-v1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

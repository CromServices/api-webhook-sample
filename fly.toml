# Disposable public demo for Crom Services api-webhook-sample.
# Sample crumb only — not a forever-host for client workloads.
app = "crom-api-webhook-demo"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # Published demo secret (same as the process default). Rotate-able public
  # sample value — never a client secret. Override with
  # `fly secrets set WEBHOOK_SECRET=...` if the documented value changes.
  WEBHOOK_SECRET = "crom-demo-webhook-secret-v1"
  # One machine, one file on that machine's disk. That disk is wiped on every
  # stop/start (auto-stop included), restart and deploy (Fly docs: the root
  # file system is ephemeral unless persist_rootfs or a volume is set), so the
  # shop starts empty after any of them. Optional DATA_SEED_PATH starts it from
  # a saved copy instead; CALL_LOG_PATH needs a volume to keep calls.
  # No volume is attached yet; add a [mounts] section only once one is approved
  # (it is infra and spend). Set DEMO_ADMIN_TOKEN with `fly secrets set` — never commit it.
  DATA_PATH = "/app/data/demo-shop.json"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
